[package]
name = "crowbot-protocol"
description = "Messages exchanged between the Crow Bot daemon and its clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
transport = ["dep:tokio"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
