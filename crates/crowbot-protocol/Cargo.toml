[package]
name = "crowbot-protocol"
description = "Messages exchanged between the Crow Bot daemon and its clients"
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
transport = ["dep:tokio", "dep:windows-sys"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
