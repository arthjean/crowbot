[package]
name = "crowbotd"
description = "Crow Bot daemon"
license = "PolyForm-Noncommercial-1.0.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
agent-client-protocol = { version = "=5.2.0", features = ["process", "unstable_auth_status"] }
crowbot-protocol = { workspace = true, features = ["transport"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
