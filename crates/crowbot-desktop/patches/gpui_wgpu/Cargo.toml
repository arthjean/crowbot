# Zed's `gpui_wgpu` at the rev pinned in `../../Cargo.toml`, with the changes of
# `../gpui_wgpu.diff`. `README.md` says why it exists and how to refresh it.
#
# Upstream takes every dependency from Zed's workspace. They are written out
# here with Zed's own requirements at that rev, so Cargo resolves the versions
# the lockfile already holds. `gpui`, `collections`, and `gpui_util` come from
# the same git rev as the client's `gpui`, so they are the same crates.
# `skrifa` is new: it is already in the graph through `swash`.

[package]
name = "gpui_wgpu"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_wgpu.rs"
doctest = false

# Zed's workspace lints, which upstream inherits.
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[features]
default = []
bench-support = ["gpui/bench-support", "dep:image"]
font-kit = ["dep:font-kit"]
test-support = ["gpui/test-support", "dep:image"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "0cfc4a483dfab6ca171df0ceedaaa2a9f7954d0e", default-features = false }
anyhow = "1.0.86"
bytemuck = "1"
collections = { git = "https://github.com/zed-industries/zed", rev = "0cfc4a483dfab6ca171df0ceedaaa2a9f7954d0e" }
cosmic-text = "0.19.0"
etagere = "0.2"
itertools = "0.14.0"
image = { version = "0.25.1", default-features = false, optional = true, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
log = { version = "0.4", default-features = false, features = ["std"] }
parking_lot = "0.12.1"
profiling = "1"
raw-window-handle = "0.6"
skrifa = "0.44"
smallvec = { version = "1.6", features = ["union", "const_new"] }
swash = "0.2.6"
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-segmentation = "1.10"
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "0cfc4a483dfab6ca171df0ceedaaa2a9f7954d0e" }

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", default-features = false, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007", default-features = false, features = ["std", "metal", "gles", "vulkan", "wgsl", "webgpu"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007", default-features = true }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007", default-features = false, features = ["webgl"] }
