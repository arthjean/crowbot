[package]
name = "crowbot-desktop"
description = "Crow Bot desktop client"
license = "GPL-3.0-or-later"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]
resolver = "3"

[[bin]]
name = "crowbot"
path = "src/main.rs"

[lints.clippy]
panic         = "deny"
unimplemented = "deny"
dbg_macro     = "deny"
todo          = "warn"
unwrap_used   = "warn"
expect_used   = "warn"

[dependencies]
crowbot-protocol = { path = "../crowbot-protocol", features = ["transport"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "0cfc4a483dfab6ca171df0ceedaaa2a9f7954d0e" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "0cfc4a483dfab6ca171df0ceedaaa2a9f7954d0e" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
unicode-segmentation = "1"

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task", rev = "41fd3359c75e221bd8b187a8ee361aa309c1714c" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.dev.package]
gpui_macros = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
