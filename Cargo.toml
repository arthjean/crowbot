[workspace]
resolver = "3"
members = ["crates/crowbotd", "crates/crowbot-protocol"]
exclude = ["crates/crowbot-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
crowbot-protocol = { path = "crates/crowbot-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = "1"

[workspace.lints.clippy]
panic         = "deny"
unimplemented = "deny"
dbg_macro     = "deny"
todo          = "warn"
unwrap_used   = "warn"
expect_used   = "warn"
