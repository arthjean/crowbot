[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.lints.clippy]
panic         = "deny"
unimplemented = "deny"
dbg_macro     = "deny"
todo          = "warn"
unwrap_used   = "warn"
expect_used   = "warn"
